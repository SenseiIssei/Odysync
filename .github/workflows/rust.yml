name: Rust CI

on:
  push:
    branches: [main, "dev/**"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # `apps/gui/src-tauri` is a workspace member, so `--workspace` builds the
      # Tauri app on every platform — and on Linux that needs GTK/WebKit
      # development headers. Without them the job died in `glib-sys`, so the
      # Linux leg of this matrix had never actually run.
      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            patchelf

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test
        run: cargo test --workspace --lib

      - name: Build release (CLI only)
        run: cargo build --release -p odysync-cli

      # This job exists to verify the code, not to distribute it — release.yml
      # is what actually publishes binaries, and its uploads stay fatal.
      # GitHub's artifact service times out often enough that letting it fail
      # a green build across the whole matrix is noise, not signal.
      # `if-no-files-found: error` is kept so a genuinely missing binary still
      # shows up in the step, just without failing the job.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: odysync-${{ matrix.os }}
          path: |
            target/release/odysync
            target/release/odysync.exe
          if-no-files-found: error

  # The GUI is half the product; it is built, tested and packaged on every
  # platform it ships for, so a frontend or Tauri-layer break surfaces here
  # rather than at release time.
  gui:
    name: gui (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            config: src-tauri/release-windows.conf.json
          - os: ubuntu-22.04
            config: src-tauri/release-unix.conf.json
          - os: macos-latest
            config: src-tauri/release-unix.conf.json

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/gui/package-lock.json

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            patchelf libfuse2 file

      - name: Install frontend dependencies
        working-directory: apps/gui
        run: npm ci

      # Rust dependencies are audited by the `audit` and `deny` jobs. Runs
      # once, on Linux, because the advisory database does not vary by OS.
      - name: Audit frontend dependencies
        if: runner.os == 'Linux'
        working-directory: apps/gui
        run: npm audit --audit-level=moderate

      - name: Typecheck
        working-directory: apps/gui
        run: npx tsc -b

      - name: Lint
        working-directory: apps/gui
        run: npx oxlint

      - name: Frontend tests
        working-directory: apps/gui
        run: npm test

      # The same packaging the release uses: installer on Windows, .dmg on
      # macOS, .deb/.rpm/AppImage on Linux, each with the CLI bundled in.
      - name: Build and package the app
        working-directory: apps/gui
        run: npx tauri build --config ${{ matrix.config }}

      # This job exists to verify the code, not to distribute it — release.yml
      # is what publishes packages. GitHub's artifact service times out often
      # enough that letting it fail a green build is noise, not signal.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: odysync-app-${{ matrix.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  audit:
    name: security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo-audit
        run: cargo audit

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Check licenses and advisories
        run: cargo deny check

  sbom:
    name: generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            patchelf

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      # `--output-pattern` was removed from cargo-cyclonedx; the current CLI
      # writes one file per package next to its manifest by default.
      - name: Generate SBOM
        run: cargo cyclonedx --format json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: "**/*.cdx.json"
          if-no-files-found: error
