name: release
on:
  push:
    tags:
      - "v*.*.*"
  # Re-run a release for an existing tag — e.g. after fixing this workflow —
  # without moving the tag. The code is checked out at the tag; only the
  # workflow definition comes from the branch it is dispatched on.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish, e.g. v3.0.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build-cli:
    name: CLI (${{ matrix.archive }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: odysync.exe
            archive: odysync-windows-x86_64.zip
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: odysync
            archive: odysync-linux-x86_64.tar.gz
          # Both Mac architectures are built on the Apple Silicon runner: the
          # Xcode SDK cross-compiles to Intel without any extra toolchain.
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: odysync
            archive: odysync-macos-arm64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: odysync
            archive: odysync-macos-x86_64.tar.gz

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release -p odysync-cli --target ${{ matrix.target }}

      # Signing is a no-op until the Trusted Signing secrets exist, so the
      # workflow keeps working today and starts signing the moment they are
      # added — rather than being a separate change that has to be remembered
      # at the same time as the procurement finishing. See docs/SIGNING.md.
      #
      # Signing happens before the archive is built, so the zip contains the
      # signed binary rather than an unsigned one next to a signature.
      - name: Sign the CLI (Windows)
        if: runner.os == 'Windows' && vars.SIGNING_ENABLED == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.TRUSTED_SIGNING_PROFILE }}
          files-folder: target/${{ matrix.target }}/release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # From inside the output directory, so the archive holds odysync.exe
        # itself rather than target/<triple>/release/odysync.exe.
        working-directory: target/${{ matrix.target }}/release
        run: 7z a "$env:GITHUB_WORKSPACE/${{ matrix.archive }}" ${{ matrix.artifact }}

      - name: Archive (Unix)
        if: runner.os != 'Windows'
        run: tar czf ${{ matrix.archive }} -C target/${{ matrix.target }}/release ${{ matrix.artifact }}

      - name: Generate SHA-256
        shell: bash
        run: |
          # One format on every platform: "<hash>  <filename>", the shape
          # `sha256sum -c` expects.
          if command -v sha256sum >/dev/null; then
            sha256sum "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
          else
            shasum -a 256 "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
          fi
          cat "${{ matrix.archive }}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
          if-no-files-found: error

  build-gui:
    name: app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            config: src-tauri/release-windows.conf.json
            bundles: |
              target/release/bundle/nsis/*.exe
          # 22.04 rather than latest: the .deb and AppImage link against the
          # build machine's glibc, and an older one runs on more systems.
          - os: ubuntu-22.04
            config: src-tauri/release-unix.conf.json
            bundles: |
              target/release/bundle/deb/*.deb
              target/release/bundle/rpm/*.rpm
              target/release/bundle/appimage/*.AppImage
          - os: macos-latest
            config: src-tauri/release-unix.conf.json
            bundles: |
              target/release/bundle/dmg/*.dmg

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@stable

      # Keyed by runner image: objects compiled against Ubuntu 24.04's glibc
      # do not link on 22.04, and the default key does not tell them apart.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/gui/package-lock.json

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            patchelf libfuse2 file

      - name: Install frontend dependencies
        working-directory: apps/gui
        run: npm ci

      # The release config also builds the CLI and bundles it, because the
      # app's scheduler runs the CLI rather than the GUI binary.
      - name: Build the app
        working-directory: apps/gui
        run: npx tauri build --config ${{ matrix.config }}

      # The installer is the artifact SmartScreen actually judges — a user
      # double-clicks this, not the CLI — so it matters more than the binaries.
      - name: Sign the installer (Windows)
        if: runner.os == 'Windows' && vars.SIGNING_ENABLED == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.TRUSTED_SIGNING_PROFILE }}
          files-folder: target/release/bundle/nsis
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Published alongside each package so a user can verify the download
      # without trusting the page it came from.
      - name: Collect packages with checksums
        shell: bash
        # Passed through the environment: interpolated straight into the
        # script, the multi-line list broke the `for` statement.
        env:
          BUNDLES: ${{ matrix.bundles }}
        run: |
          set -euo pipefail
          mkdir -p dist-out
          for pattern in $BUNDLES; do
            for f in $pattern; do cp "$f" dist-out/; done
          done
          cd dist-out
          for f in *; do
            if command -v sha256sum >/dev/null; then sha256sum "$f" > "$f.sha256"; else shasum -a 256 "$f" > "$f.sha256"; fi
            cat "$f.sha256"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.os }}
          path: dist-out/*
          if-no-files-found: error

  publish:
    needs: [build-cli, build-gui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # A tool whose entire purpose is keeping other software current should be
      # installable with `winget install Odysync`. The manifests are generated
      # here because the installer's SHA-256 is only known now; submitting them
      # to microsoft/winget-pkgs stays a manual step.
      - name: Generate winget manifests
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          installer=$(ls artifacts/*setup.exe | head -n1)
          sha=$(sha256sum "$installer" | cut -d' ' -f1 | tr 'a-f' 'A-F')
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/$(basename "$installer")"
          out="winget/SenseiIssei.Odysync/${version}"
          mkdir -p "$out"

          cat > "$out/SenseiIssei.Odysync.yaml" <<EOF
          PackageIdentifier: SenseiIssei.Odysync
          PackageVersion: ${version}
          DefaultLocale: en-US
          ManifestType: version
          ManifestVersion: 1.6.0
          EOF

          cat > "$out/SenseiIssei.Odysync.installer.yaml" <<EOF
          PackageIdentifier: SenseiIssei.Odysync
          PackageVersion: ${version}
          InstallerType: nullsoft
          Scope: machine
          InstallModes:
            - interactive
            - silent
          Installers:
            - Architecture: x64
              InstallerUrl: ${url}
              InstallerSha256: ${sha}
          ManifestType: installer
          ManifestVersion: 1.6.0
          EOF

          cat > "$out/SenseiIssei.Odysync.locale.en-US.yaml" <<EOF
          PackageIdentifier: SenseiIssei.Odysync
          PackageVersion: ${version}
          PackageLocale: en-US
          Publisher: SenseiIssei
          PublisherUrl: https://github.com/SenseiIssei
          PackageName: Odysync
          PackageUrl: https://github.com/${GITHUB_REPOSITORY}
          License: MIT
          LicenseUrl: https://github.com/${GITHUB_REPOSITORY}/blob/main/LICENSE
          ShortDescription: Safe software and driver updates for Windows, macOS and Linux.
          Tags:
            - updater
            - drivers
            - windows-update
            - maintenance
          ManifestType: defaultLocale
          ManifestVersion: 1.6.0
          EOF
          find winget -type f

      - uses: actions/upload-artifact@v7
        with:
          name: winget-manifests
          path: winget/**
          if-no-files-found: error

      - name: Release notes
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          notes="docs/release-notes/v${version}.md"
          if [ -f "$notes" ]; then cp "$notes" release-notes.md; else echo "Odysync ${version}" > release-notes.md; fi

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.RELEASE_TAG }}
          name: Odysync ${{ env.RELEASE_TAG }}
          bodyFile: release-notes.md
          artifacts: "artifacts/*"
          # A re-run for an existing tag replaces the assets of that release
          # instead of failing because the release already exists.
          allowUpdates: true
          replacesArtifacts: true
