[package]
name = "odysync-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Not published to crates.io; also lets cargo-deny's allow-wildcard-paths
# apply to our path dependencies on each other.
publish = false
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Domain model, safety policy and update planner for Odysync"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
async-trait.workspace = true
directories.workspace = true
tracing.workspace = true
tokio.workspace = true
regex = "1"

# `health::get_free_space` calls `libc::statvfs` under `cfg(unix)`. Without
# this the crate does not compile on Linux or macOS at all — only the Windows
# job in CI was ever green.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Restore",
    # `platform::reboot_pending` reads the three registry locations Windows
    # itself uses to record "a restart is needed to finish servicing".
    "Win32_System_Registry",
    # `platform::power_source`, so the daemon does not scan on battery.
    "Win32_System_Power",
    # `platform::resident_memory_bytes`, for the idle-RSS target.
    "Win32_System_ProcessStatus",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "time", "fs", "io-util"] }
tempfile = "3"

[lints]
workspace = true
