[workspace]
resolver = "2"
members = [
    "crates/odysync-core",
    "crates/odysync-verify",
    "crates/odysync-backends",
    "crates/odysync-cli",
    "apps/gui/src-tauri",
]

[workspace.package]
version = "3.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/SenseiIssei/Odysync"
authors = ["Jakob (SenseiIssei)"]

# The MSVC linker reports that it wrote an import library for every binary,
# and rustc 1.9x surfaces that as a `linker_messages` warning. Under CI's
# `-D warnings` that informational line would fail the Windows build, so it
# is silenced once here rather than per crate. `unknown_lints` keeps older
# compilers, which do not know the lint, from warning about its name.
[workspace.lints.rust]
unknown_lints = "allow"
linker_messages = "allow"

[workspace.dependencies]
odysync-core = { path = "crates/odysync-core" }
odysync-verify = { path = "crates/odysync-verify" }
odysync-backends = { path = "crates/odysync-backends" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "io-util", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.11"
hex = "0.4"
directories = "6"
async-trait = "0.1"
zip = { version = "9", default-features = false, features = ["deflate"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
