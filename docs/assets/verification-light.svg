<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="230" viewBox="0 0 1100 230" role="img" aria-label="Before an installer runs: exact version, publisher URL, locked file, SHA-256, pinned signer">
  <defs>
    <style>
      text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
      .lit { opacity: 0; animation: lit 7.0s ease-in-out infinite; }
      .ok { opacity: 0; transform-box: fill-box; transform-origin: center; animation: ok 7.0s ease-out infinite; }
      .flow { opacity: .25; animation: flow 7.0s ease-in-out infinite; }
      .run { opacity: 0; animation: run 7.0s ease-in-out infinite; animation-delay: 4.1s; }
      @keyframes lit { 0% { opacity: 0; } 6% { opacity: 1; } 70% { opacity: 1; } 85%,100% { opacity: 0; } }
      @keyframes ok { 0% { opacity: 0; transform: scale(.4); } 5% { opacity: 1; transform: scale(1.1); } 8% { transform: scale(1); } 70% { opacity: 1; } 85%,100% { opacity: 0; } }
      @keyframes flow { 0% { opacity: .25; } 5% { opacity: 1; } 70% { opacity: 1; } 85%,100% { opacity: .25; } }
      @keyframes run { 0% { opacity: 0; } 6% { opacity: 1; } 30% { opacity: 1; } 45%,100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .lit, .ok, .flow, .run { animation: none; opacity: 1; } }
    </style>
  </defs>
  <rect width="1100" height="230" rx="20" fill="#f7f8fa" stroke="#e2e5ea"/>
  <text x="30" y="30" font-size="14" fill="#545d69">Before an installer Odysync downloaded is allowed to run — every step is fatal on its own</text>
  
    <g>
      <rect x="30" y="48" width="190" height="112" rx="16" fill="#ffffff" stroke="#e2e5ea"/>
      <rect class="lit" style="animation-delay:0.35s" x="30" y="48" width="190" height="112" rx="16" fill="none" stroke="#4b5bd3" stroke-width="2"/>
      <text x="50" y="84" font-size="13" font-weight="600" fill="#8a929c">STEP 1</text>
      <text x="50" y="112" font-size="18" font-weight="600" fill="#1a1e24">Exact version</text>
      <text x="50" y="137" font-size="14" fill="#545d69">the one you approved</text>
      <g class="ok" style="animation-delay:0.7s">
        <circle cx="192" cy="80" r="12" fill="#1c8a56" fill-opacity="0.16"/>
        <path d="M186 80 l4 4 l7.5-8" fill="none" stroke="#1c8a56" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
    <path class="flow" style="animation-delay:0.85s" d="M222 104 h20" stroke="#4b5bd3" stroke-width="2" stroke-linecap="round"/>
    <g>
      <rect x="244" y="48" width="190" height="112" rx="16" fill="#ffffff" stroke="#e2e5ea"/>
      <rect class="lit" style="animation-delay:1.1s" x="244" y="48" width="190" height="112" rx="16" fill="none" stroke="#4b5bd3" stroke-width="2"/>
      <text x="264" y="84" font-size="13" font-weight="600" fill="#8a929c">STEP 2</text>
      <text x="264" y="112" font-size="18" font-weight="600" fill="#1a1e24">Publisher URL</text>
      <text x="264" y="137" font-size="14" fill="#545d69">HTTPS on every hop</text>
      <g class="ok" style="animation-delay:1.4500000000000002s">
        <circle cx="406" cy="80" r="12" fill="#1c8a56" fill-opacity="0.16"/>
        <path d="M400 80 l4 4 l7.5-8" fill="none" stroke="#1c8a56" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
    <path class="flow" style="animation-delay:1.6s" d="M436 104 h20" stroke="#4b5bd3" stroke-width="2" stroke-linecap="round"/>
    <g>
      <rect x="458" y="48" width="190" height="112" rx="16" fill="#ffffff" stroke="#e2e5ea"/>
      <rect class="lit" style="animation-delay:1.85s" x="458" y="48" width="190" height="112" rx="16" fill="none" stroke="#4b5bd3" stroke-width="2"/>
      <text x="478" y="84" font-size="13" font-weight="600" fill="#8a929c">STEP 3</text>
      <text x="478" y="112" font-size="18" font-weight="600" fill="#1a1e24">Locked file</text>
      <text x="478" y="137" font-size="14" fill="#545d69">re-hashed from disk</text>
      <g class="ok" style="animation-delay:2.2s">
        <circle cx="620" cy="80" r="12" fill="#1c8a56" fill-opacity="0.16"/>
        <path d="M614 80 l4 4 l7.5-8" fill="none" stroke="#1c8a56" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
    <path class="flow" style="animation-delay:2.35s" d="M650 104 h20" stroke="#4b5bd3" stroke-width="2" stroke-linecap="round"/>
    <g>
      <rect x="672" y="48" width="190" height="112" rx="16" fill="#ffffff" stroke="#e2e5ea"/>
      <rect class="lit" style="animation-delay:2.6s" x="672" y="48" width="190" height="112" rx="16" fill="none" stroke="#4b5bd3" stroke-width="2"/>
      <text x="692" y="84" font-size="13" font-weight="600" fill="#8a929c">STEP 4</text>
      <text x="692" y="112" font-size="18" font-weight="600" fill="#1a1e24">SHA-256</text>
      <text x="692" y="137" font-size="14" fill="#545d69">matches the source</text>
      <g class="ok" style="animation-delay:2.95s">
        <circle cx="834" cy="80" r="12" fill="#1c8a56" fill-opacity="0.16"/>
        <path d="M828 80 l4 4 l7.5-8" fill="none" stroke="#1c8a56" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
    <path class="flow" style="animation-delay:3.1s" d="M864 104 h20" stroke="#4b5bd3" stroke-width="2" stroke-linecap="round"/>
    <g>
      <rect x="886" y="48" width="190" height="112" rx="16" fill="#ffffff" stroke="#e2e5ea"/>
      <rect class="lit" style="animation-delay:3.35s" x="886" y="48" width="190" height="112" rx="16" fill="none" stroke="#4b5bd3" stroke-width="2"/>
      <text x="906" y="84" font-size="13" font-weight="600" fill="#8a929c">STEP 5</text>
      <text x="906" y="112" font-size="18" font-weight="600" fill="#1a1e24">Pinned signer</text>
      <text x="906" y="137" font-size="14" fill="#545d69">valid + expected</text>
      <g class="ok" style="animation-delay:3.7s">
        <circle cx="1048" cy="80" r="12" fill="#1c8a56" fill-opacity="0.16"/>
        <path d="M1042 80 l4 4 l7.5-8" fill="none" stroke="#1c8a56" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  <g class="run">
    <rect x="410" y="180" width="280" height="34" rx="17" fill="#1c8a56" fill-opacity="0.14"/>
    <text x="550" y="202" font-size="15" font-weight="600" fill="#1c8a56" text-anchor="middle">✓  install, then read the version back</text>
  </g>
</svg>
