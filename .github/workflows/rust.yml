name: Rust CI

on:
  push:
    branches: [main, "dev/**"]
  pull_request:
    branches: [main]
  # Weekly, so a new Rust, Node or runner image that breaks the build shows up
  # here rather than in the next release.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # `apps/gui/src-tauri` is a workspace member, so `--workspace` builds the
      # Tauri app on every platform — and on Linux that needs GTK/WebKit
      # development headers. Without them the job died in `glib-sys`, so the
      # Linux leg of this matrix had never actually run.
      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            patchelf

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test
        run: cargo test --workspace --lib

      - name: Build release (CLI only)
        run: cargo build --release -p odysync-cli

      # The CLI against the real runner: every read-only command must run to
      # completion on every platform. Nothing here changes the machine.
      - name: CLI smoke test
        shell: bash
        run: |
          set -euo pipefail
          bin=target/release/odysync
          [ "$RUNNER_OS" = "Windows" ] && bin=target/release/odysync.exe
          "$bin" --version
          "$bin" backends
          "$bin" sysinfo
          "$bin" startup
          "$bin" clean
          "$bin" components
          "$bin" devices
          "$bin" --json scan > scan.json
          head -c 400 scan.json; echo

      # This job exists to verify the code, not to distribute it — release.yml
      # is what actually publishes binaries, and its uploads stay fatal.
      # GitHub's artifact service times out often enough that letting it fail
      # a green build across the whole matrix is noise, not signal.
      # `if-no-files-found: error` is kept so a genuinely missing binary still
      # shows up in the step, just without failing the job.
      - uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: odysync-${{ matrix.os }}
          path: |
            target/release/odysync
            target/release/odysync.exe
          if-no-files-found: error

  # The GUI is half the product; it is built, tested and packaged on every
  # platform it ships for, so a frontend or Tauri-layer break surfaces here
  # rather than at release time.
  gui:
    name: gui (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            config: src-tauri/release-windows.conf.json
          - os: ubuntu-22.04
            config: src-tauri/release-unix.conf.json
          - os: macos-latest
            config: src-tauri/release-unix.conf.json

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # Keyed by runner image: objects compiled against Ubuntu 24.04's glibc
      # do not link on 22.04, and the default key does not tell them apart.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/gui/package-lock.json

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            patchelf libfuse2 file

      - name: Install frontend dependencies
        working-directory: apps/gui
        run: npm ci

      # Rust dependencies are audited by the `audit` and `deny` jobs. Runs
      # once, on Linux, because the advisory database does not vary by OS.
      - name: Audit frontend dependencies
        if: runner.os == 'Linux'
        working-directory: apps/gui
        run: npm audit --audit-level=moderate

      - name: Typecheck
        working-directory: apps/gui
        run: npx tsc -b

      - name: Lint
        working-directory: apps/gui
        run: npx oxlint

      - name: Frontend tests
        working-directory: apps/gui
        run: npm test

      # The same packaging the release uses: installer on Windows, .dmg on
      # macOS, .deb/.rpm/AppImage on Linux, each with the CLI bundled in.
      - name: Build and package the app
        working-directory: apps/gui
        run: npx tauri build --config ${{ matrix.config }}

      # Building is not running. Start the real app and require it to still be
      # alive after 20 seconds — long enough for the webview to load and the
      # startup scan to begin. A crash, a missing library or a panic fails.
      - name: Install a virtual display (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y xvfb dbus-x11

      - name: App smoke test
        shell: bash
        run: |
          set -uo pipefail
          case "$RUNNER_OS" in
            Windows) app=target/release/odysync-gui.exe ;;
            macOS)   app=target/release/odysync-gui ;;
            Linux)   app=target/release/odysync-gui ;;
          esac
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a dbus-launch --exit-with-session "$app" > app.log 2>&1 &
          else
            "$app" > app.log 2>&1 &
          fi
          pid=$!
          sleep 20
          if kill -0 "$pid" 2>/dev/null; then
            echo "the app is running after 20 s"
            kill "$pid" 2>/dev/null || true
            # On Linux the xvfb-run wrapper is the tracked process.
            pkill -f odysync-gui 2>/dev/null || true
          else
            wait "$pid"; code=$?
            echo "the app exited early with code $code"
            cat app.log
            exit 1
          fi
          tail -n 20 app.log || true

      # This job exists to verify the code, not to distribute it — release.yml
      # is what publishes packages. GitHub's artifact service times out often
      # enough that letting it fail a green build is noise, not signal.
      - uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: odysync-app-${{ matrix.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  audit:
    name: security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo-audit
        run: cargo audit

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Check licenses and advisories
        run: cargo deny check

  sbom:
    name: generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            patchelf

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      # `--output-pattern` was removed from cargo-cyclonedx; the current CLI
      # writes one file per package next to its manifest by default.
      - name: Generate SBOM
        run: cargo cyclonedx --format json

      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: "**/*.cdx.json"
          if-no-files-found: error

  # A red scheduled run on main means something changed underneath the
  # project — a new advisory, a new toolchain, a new runner image — and nobody
  # pushed anything that would make them look. Say so where it is seen: one
  # open issue, commented on for every further failure.
  alert:
    name: report a failing weekly run
    needs: [test, gui, audit, deny, sbom]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Weekly CI is failing on main"
          existing=$(gh issue list -R "$REPO" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          body="The scheduled run failed: $RUN"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" -R "$REPO" --body "$body"
          else
            gh issue create -R "$REPO" --title "$title" --body "$body"
          fi
